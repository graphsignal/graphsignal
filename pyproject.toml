[tool.poetry]
name = "graphsignal"
version = "1.1.0"
description = "GPU profiler for AI agents optimizing inference performance"
authors = ["Graphsignal, Inc. <devops@graphsignal.com>"]
license = "Apache-2.0"
homepage = "https://graphsignal.com"
repository = "https://github.com/graphsignal/graphsignal"
readme = "README.md"
keywords = ["Inference profiler", "CUDA profiler", "GPU profiler"]
include = [
    "graphsignal/_native/*",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[tool.poetry.dependencies]
python = ">=3.9,<4"
xxhash = "*"
# Floor set by the GENCODE version in graphsignal/proto/signals_pb2.py, not by
# any feature we need: protobuf refuses to load gencode newer than the runtime,
# and the profiler is installed into containers somebody else built — commonly
# with --no-deps, so it cannot upgrade what it finds. See scripts/build-protobuf.sh.
protobuf = ">=5.27"
requests = "*"
nvidia-ml-py = ">=12"
psutil = ">=5.9"
prometheus-client = "*"
nvidia-cuda-cupti-cu12 = { version = ">=12,<13", optional = true, markers = "sys_platform == 'linux'" }
nvidia-cuda-cupti = { version = ">=13,<14", optional = true, markers = "sys_platform == 'linux'" }

[tool.poetry.extras]
cu12 = ["nvidia-cuda-cupti-cu12"]
cu13 = ["nvidia-cuda-cupti"]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-forked = "*"

[tool.poetry.scripts]
graphsignal-run = "graphsignal.commands.graphsignal_run:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
